<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hearth -- Harmony Labs — Harmony Labs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e8dcc4; font-family: 'Courier New', monospace; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
  header { text-align: center; padding: 2rem 0 3rem; border-bottom: 1px solid #3a2a1a; margin-bottom: 3rem; }
  h1 { font-size: 2rem; color: #d4a843; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .subtitle { color: #8a7a5a; font-size: 0.9rem; letter-spacing: 0.15em; }
  .flame-icon { font-size: 3rem; margin-bottom: 1rem; }
  .section { background: #12100e; border: 1px solid #2a2a1a; border-radius: 8px; padding: 2rem; margin-bottom: 2rem; }
  h2 { color: #d4a843; font-size: 1.1rem; letter-spacing: 0.1em; margin-bottom: 1.5rem; border-bottom: 1px solid #3a2a1a; padding-bottom: 0.5rem; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .metric { background: #1a1510; border: 1px solid #3a2a1a; border-radius: 6px; padding: 1.25rem; text-align: center; }
  .metric-value { font-size: 1.8rem; color: #d4a843; font-weight: bold; }
  .metric-label { color: #8a7a5a; font-size: 0.75rem; letter-spacing: 0.1em; margin-top: 0.25rem; text-transform: uppercase; }
  .log-stream { background: #0a0a0f; border: 1px solid #2a2a1a; border-radius: 6px; padding: 1rem; height: 200px; overflow-y: auto; font-size: 0.8rem; color: #6a5a3a; }
  .log-entry { padding: 0.25rem 0; border-bottom: 1px solid #1a1510; }
  .log-time { color: #4a3a2a; margin-right: 0.75rem; }
  .log-mu { color: #d4a843; }
  .controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }
  button { background: #1a1510; color: #d4a843; border: 1px solid #3a2a1a; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.85rem; letter-spacing: 0.1em; transition: all 0.2s; }
  button:hover { background: #2a2015; border-color: #d4a843; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #12100e; border: 1px solid #2a2a1a; border-radius: 6px; margin-top: 1.5rem; font-size: 0.8rem; color: #6a5a3a; }
  .status-ok { color: #5a8a5a; }
  .status-warn { color: #d4a843; }
  .status-err { color: #8a4a4a; }
  footer { text-align: center; padding: 2rem 0; color: #4a3a2a; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="flame-icon">🔥</div>
    <h1>The Hearth</h1>
    <div class="subtitle">FOUNDATIONAL CORE · HARMONY LABS · SOVEREIGN ARCHITECTURE</div>
  </header>

  <div class="section">
    <h2>// SYSTEM STATUS</h2>
    <div class="metric-grid">
      <div class="metric">
        <div class="metric-value" id="mu-display">—</div>
        <div class="metric-label">Coherence μ</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="domains-display">0/6</div>
        <div class="metric-label">Domains Active</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="laws-display">0/16</div>
        <div class="metric-label">Laws Enforced</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="uptime-display">—</div>
        <div class="metric-label">Uptime</div>
      </div>
    </div>
    <div class="log-stream" id="log">
      <div class="log-entry"><span class="log-time">—</span><span>System initializing...</span></div>
    </div>
    <div class="controls">
      <button onclick="startHearth()">▶ IGNITE HEARTH</button>
      <button onclick="stabilize()">◈ STABILIZE μ</button>
      <button onclick="syncDomains()">⬡ SYNC DOMAINS</button>
      <button onclick="clearLog()">✕ CLEAR LOG</button>
    </div>
    <div class="status-bar">
      <span id="sys-status">Status: Cold</span>
      <span id="mu-threshold">Threshold: μ ≥ 0.9995</span>
      <span id="arch">Arch: Sovereign · No Vendor · No Cloud</span>
    </div>
  </div>
</div>
<script>
const LAWS = ['Truth','Consent','Dignity','Transparency','Accountability','Security','Privacy','Fairness','Sustainability','Accessibility','Innovation','Interoperability','Sovereignty','Resilience','Harmony','Eternity'];
const DOMAINS = ['Chemical','Ionic','Quantum','Thermal','Mechanical','Valley'];
const state = { running: false, mu: 0, activeLaws: 0, startTime: null, logs: [] };

function log(msg, mu = null) {
  const t = new Date().toISOString().substr(11, 8);
  const entry = `<div class="log-entry"><span class="log-time">${t}</span>${mu !== null ? \`<span class="log-mu">[μ ${mu.toFixed(4)}]</span>\` : ''}<span>${msg}</span></div>`;
  document.getElementById('log').innerHTML += entry;
  document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
}

function computeMu() {
  let base = 0.9997;
  const jitter = (Math.random() - 0.5) * 0.0004;
  const domainBonus = state.running ? (DOMAINS.length * 0.00003) : 0;
  return Math.min(1.0, base + jitter + domainBonus);
}

function updateDisplay() {
  const mu = state.mu;
  document.getElementById('mu-display').textContent = mu > 0 ? mu.toFixed(4) : '—';
  document.getElementById('mu-display').style.color = mu >= 0.9995 ? '#5a8a5a' : mu >= 0.9990 ? '#d4a843' : '#8a4a4a';
  document.getElementById('domains-display').textContent = state.running ? '6/6' : '0/6';
  document.getElementById('laws-display').textContent = state.running ? '16/16' : '0/16';
  if (state.startTime) {
    const s = Math.floor((Date.now() - state.startTime) / 1000);
    document.getElementById('uptime-display').textContent = `${Math.floor(s/60)}m ${s%60}s`;
  }
  const status = document.getElementById('sys-status');
  if (!state.running) {
    status.textContent = 'Status: Cold'; status.className = 'status-err';
  } else if (mu >= 0.9995) {
    status.textContent = 'Status: Optimal'; status.className = 'status-ok';
  } else {
    status.textContent = 'Status: Degraded'; status.className = 'status-warn';
  }
}

function startHearth() {
  state.running = true; state.startTime = Date.now();
  log('🔥 Hearth ignition sequence initiated');
  log('⚙️ Loading resonance kernel...');
  setTimeout(() => log('✓ All 16 laws loaded and enforced') , 600);
  setTimeout(() => log('⬡ 6 domains activating...') , 1200);
  setTimeout(() => {
    log('✓ Coherence threshold achieved: μ ≥ 0.9995', 0.9997);
    log('🔐 System sealed — sovereignty confirmed');
  }, 1800);
  runHearth();
}

function runHearth() {
  if (!state.running) return;
  state.mu = computeMu();
  const m = state.mu;
  if (m >= 0.9995) log('◈ Resonance stable', m);
  else log(`⚠ Coherence fluctuation detected: μ = ${m.toFixed(4)}`, m);
  updateDisplay();
  setTimeout(runHearth, 2000);
}

function stabilize() {
  state.mu = 0.9997;
  log('◈ Manual stabilization: μ reset to 0.9997');
  updateDisplay();
}

function syncDomains() {
  log('⬡ Syncing all 6 domains...');
  setTimeout(() => { log('✓ All domains in resonance'); updateDisplay(); }, 800);
}

function clearLog() { document.getElementById('log').innerHTML = ''; }

setInterval(updateDisplay, 1000);
</script>
</body>
</html>
